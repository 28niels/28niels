<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="28niels – Aspiring Full-Stack Developer">
  <defs>
    <clipPath id="c"><rect width="1000" height="300" rx="14"/></clipPath>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.25" stop-color="#ffffff"/><stop offset="1" stop-color="#6b6f76"/>
    </linearGradient>
    <radialGradient id="s" cx="0.18" cy="0" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .f { animation: f 1s ease-out backwards; }
      @keyframes f { from { opacity: 0 } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="300" fill="#09090b"/>
    <rect width="1000" height="300" fill="url(#s)"/>
    <g class="f">
      <circle cx="62" cy="58" r="4" fill="#4ade80"/>
      <text x="78" y="63" font-size="15" font-weight="500" fill="#d4d4d8">Aspiring Full-Stack Developer</text>
      <text x="944" y="63" font-size="15" fill="#71717a" text-anchor="end">Web · Automatisierung · Deutschland</text>
      <rect x="56" y="88" width="888" height="1" fill="#ffffff" fill-opacity="0.10"/>
    </g>
    <g class="f" style="animation-delay:.2s">
      <text x="46" y="282" font-size="176" font-weight="800" letter-spacing="-9" fill="url(#t)">28niels</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="299" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
