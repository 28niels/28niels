<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="28niels – Software Developer">
  <defs>
    <radialGradient id="hl" cx="0.95" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="1000" height="240" rx="14"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .f { animation: f .8s ease-out backwards; }
      .f2 { animation-delay: .15s } .f3 { animation-delay: .3s } .f4 { animation-delay: .45s }
      @keyframes f { from { opacity: 0 } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="240" fill="#0a0a0b"/>
    <rect width="1000" height="240" fill="url(#hl)"/>
    <rect x="0" y="0" width="5" height="240" fill="#3b82f6"/>

    <g class="f">
      <text x="64" y="68" font-size="12" font-weight="600" letter-spacing="3.2" fill="#6b7280">SOFTWARE DEVELOPER</text>
    </g>
    <g class="f f2">
      <text x="62" y="140" font-size="72" font-weight="700" letter-spacing="-2.2" fill="#fafafa">28niels</text>
    </g>
    <g class="f f3">
      <text x="64" y="182" font-size="18" fill="#9ca3af">Web-Entwicklung und Automatisierung.</text>
      <text x="64" y="208" font-size="18" fill="#9ca3af">Eigene Produkte, sauber umgesetzt.</text>
    </g>

    <g class="f f4">
      <path d="M640 56V184" stroke="#ffffff" stroke-opacity="0.1"/>
      <g font-size="11" font-weight="600" letter-spacing="2.4" fill="#6b7280">
        <text x="676" y="76">FOKUS</text>
        <text x="676" y="124">STACK</text>
        <text x="676" y="172">AKTUELL</text>
      </g>
      <g font-size="16" fill="#e5e7eb">
        <text x="676" y="98">Web · Automatisierung</text>
        <text x="676" y="146">Python · Lua · Next.js · TypeScript</text>
        <text x="676" y="194" font-weight="600" fill="#ffffff">csbuddy.app</text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="239" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
