<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="28niels – Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/><stop offset="1" stop-color="#0c1228"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a5c0ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1000" height="300" fill="url(#fadeR)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1000" height="300" rx="20"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .b1 { animation: d1 14s ease-in-out infinite alternate; }
      .b2 { animation: d2 17s ease-in-out infinite alternate; }
      .b3 { animation: d3 11s ease-in-out infinite alternate; }
      .in { animation: in .9s cubic-bezier(.2,.7,.2,1) backwards; }
      .i1 { animation-delay: .1s } .i2 { animation-delay: .35s } .i3 { animation-delay: .6s } .i4 { animation-delay: .85s }
      .bar { transform-box: fill-box; transform-origin: 0 50%; animation: grow 1s .2s cubic-bezier(.2,.7,.2,1) backwards; }
      .dot { animation: pulse 2s ease-in-out infinite; }
      .code { animation: float 9s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(120px, 40px) } }
      @keyframes d2 { to { transform: translate(-140px, -30px) } }
      @keyframes d3 { to { transform: translate(60px, -50px) } }
      @keyframes in { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      @keyframes grow { from { transform: scaleX(0) } }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes float { to { transform: translateY(-10px) } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="b1" cx="220" cy="80" r="110" fill="#2563eb" fill-opacity=".55"/>
      <circle class="b2" cx="760" cy="230" r="130" fill="#7c3aed" fill-opacity=".5"/>
      <circle class="b3" cx="560" cy="60" r="80" fill="#06b6d4" fill-opacity=".3"/>
    </g>
    <g mask="url(#gridMask)" stroke="#8aa4ff" stroke-opacity=".14" stroke-width="1">
      <path d="M0 50H1000M0 100H1000M0 150H1000M0 200H1000M0 250H1000"/>
      <path d="M50 0V300M100 0V300M150 0V300M200 0V300M250 0V300M300 0V300M350 0V300M400 0V300M450 0V300M500 0V300M550 0V300M600 0V300M650 0V300M700 0V300M750 0V300M800 0V300M850 0V300M900 0V300M950 0V300"/>
    </g>

    <g class="code mono" font-size="14" fill="#9db4ff" fill-opacity=".55">
      <text x="640" y="88"><tspan fill="#c4a5ff">const</tspan> dev = {</text>
      <text x="662" y="112">name: <tspan fill="#7ee0b0">"28niels"</tspan>,</text>
      <text x="662" y="136">stack: [<tspan fill="#7ee0b0">"Python"</tspan>, <tspan fill="#7ee0b0">"Lua"</tspan>,</text>
      <text x="662" y="160"><tspan fill="#7ee0b0">"Next.js"</tspan>, <tspan fill="#7ee0b0">"TypeScript"</tspan>],</text>
      <text x="662" y="184">building: <tspan fill="#7ee0b0">"csbuddy.app"</tspan>,</text>
      <text x="640" y="208">};</text>
    </g>

    <rect class="bar" x="70" y="72" width="64" height="5" rx="2.5" fill="url(#bar)"/>
    <g class="in i1"><text x="70" y="112" font-size="15" font-weight="600" letter-spacing="4" fill="#7f95d6">SOFTWARE DEVELOPER</text></g>
    <g class="in i2" filter="url(#glow)"><text x="66" y="188" font-size="92" font-weight="800" letter-spacing="-3" fill="url(#name)">28niels</text></g>
    <g class="in i3"><text x="70" y="232" font-size="21" fill="#c3d0f5">Web  ·  Automatisierung  ·  Eigene Produkte</text></g>
    <g class="in i4">
      <circle class="dot" cx="76" cy="262" r="5" fill="#34d399"/>
      <text x="92" y="267" font-size="15" fill="#8ea3dc">Aktuell in Entwicklung: <tspan fill="#ffffff" font-weight="600">csbuddy.app</tspan></text>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="299" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
