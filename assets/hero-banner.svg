<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="28niels – Aspiring Full-Stack Developer">
  <defs>
    <clipPath id="c"><rect width="1000" height="300" rx="14"/></clipPath>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.2" stop-color="#ffffff"/><stop offset="1" stop-color="#9a9aa3"/>
    </linearGradient>
    <radialGradient id="s" cx="0.8" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .f { animation: f 1s ease-out backwards; }
      .o1 { transform-origin: 790px 150px; animation: spin 28s linear infinite; }
      .o2 { transform-origin: 790px 150px; animation: spin 46s linear infinite reverse; }
      .o3 { transform-origin: 790px 150px; animation: spin 70s linear infinite; }
      @keyframes f { from { opacity: 0 } }
      @keyframes spin { to { transform: rotate(360deg) } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="300" fill="#09090b"/>
    <rect width="1000" height="300" fill="url(#s)"/>

    <g fill="none" stroke="#ffffff" stroke-opacity="0.09">
      <circle cx="790" cy="150" r="46"/>
      <circle cx="790" cy="150" r="92"/>
      <circle cx="790" cy="150" r="138"/>
      <circle cx="790" cy="150" r="184" stroke-opacity="0.05"/>
    </g>
    <g class="o1"><circle cx="836" cy="150" r="4" fill="#f4f4f5"/></g>
    <g class="o2"><circle cx="790" cy="58" r="3.2" fill="#a1a1aa"/></g>
    <g class="o3"><circle cx="928" cy="150" r="2.6" fill="#71717a"/></g>
    <circle cx="790" cy="150" r="2" fill="#f4f4f5" fill-opacity="0.6"/>

    <g class="f">
      <circle cx="62" cy="62" r="4" fill="#4ade80"/>
      <text x="78" y="67" font-size="14" fill="#8e8e96">Deutschland</text>
    </g>
    <g class="f" style="animation-delay:.15s">
      <text x="56" y="168" font-size="84" font-weight="800" letter-spacing="-4" fill="url(#t)">28niels</text>
    </g>
    <g class="f" style="animation-delay:.3s">
      <text x="58" y="212" font-size="22" font-weight="500" fill="#e4e4e7">Aspiring Full-Stack Developer</text>
      <text x="58" y="242" font-size="15" fill="#71717a">Web  ·  Automatisierung  ·  Datenbanken</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="299" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
