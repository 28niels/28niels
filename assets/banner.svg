<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="28niels – Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f15"/><stop offset="1" stop-color="#0f1620"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.92" cy="1.05" r="0.75">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1000" height="240" rx="14"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .f { animation: f .9s ease-out backwards; } .f2 { animation-delay: .2s } .f3 { animation-delay: .4s }
      @keyframes f { from { opacity: 0 } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#glow)"/>

    <g class="f"><text x="64" y="70" font-size="12" font-weight="600" letter-spacing="3.5" fill="#58a6ff">SOFTWARE DEVELOPER</text></g>
    <g class="f f2"><text x="62" y="140" font-size="70" font-weight="700" letter-spacing="-2.4" fill="#f5f7fa">28niels</text></g>
    <rect x="64" y="162" width="220" height="1.5" fill="url(#rule)"/>
    <g class="f f3">
      <text x="64" y="196" font-size="17" fill="#9aa7b6">Web &amp; Automatisierung  <tspan fill="#3b4656">|</tspan>  Deutschland  <tspan fill="#3b4656">|</tspan>  <tspan fill="#e6edf3" font-weight="600">csbuddy.app</tspan></text>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="239" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
