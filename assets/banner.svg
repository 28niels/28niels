<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="28niels – terminal banner">
  <style>
    :root { --bg:#0b0d10; --fg:#e6edf3; --dim:#6e7681; --acc:#3fb950; --grid:#161b22; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f6f8fa; --fg:#1f2328; --dim:#8c959f; --acc:#1a7f37; --grid:#e6eaee; }
    }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg { fill: var(--bg); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .dim { fill: var(--dim); font-size: 15px; }
    .big { fill: var(--fg); font-size: 76px; font-weight: 700; letter-spacing: -2px; }
    .acc { fill: var(--acc); }
    .prompt { fill: var(--acc); font-size: 17px; }
    .line { fill: var(--fg); font-size: 17px; }
    .cursor { fill: var(--acc); animation: blink 1.1s steps(1) infinite; }
    .type { clip-path: inset(0 100% 0 0); animation: type 1.6s steps(24) .4s forwards; }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    .d1 { animation-delay: 2.1s; } .d2 { animation-delay: 2.5s; } .d3 { animation-delay: 2.9s; }
    .scan { animation: scan 6s linear infinite; opacity: .06; fill: var(--acc); }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(260px); } }
  </style>
  <rect class="bg" width="900" height="260" rx="14"/>
  <g class="grid">
    <path d="M0 40H900M0 80H900M0 120H900M0 160H900M0 200H900M0 240H900"/>
    <path d="M60 0V260M120 0V260M180 0V260M240 0V260M300 0V260M360 0V260M420 0V260M480 0V260M540 0V260M600 0V260M660 0V260M720 0V260M780 0V260M840 0V260"/>
  </g>
  <rect class="scan" width="900" height="40"/>
  <circle cx="30" cy="28" r="6" fill="#ff5f56"/><circle cx="52" cy="28" r="6" fill="#ffbd2e"/><circle cx="74" cy="28" r="6" fill="#27c93f"/>
  <text x="100" y="33" class="dim">niels@github ~ %</text>

  <text x="40" y="115" class="big">28<tspan class="acc">niels</tspan></text>

  <text x="42" y="160" class="prompt">$</text>
  <g class="type"><text x="62" y="160" class="line">whoami --verbose</text></g>

  <g class="fade d1"><text x="62" y="188" class="dim">role     </text><text x="160" y="188" class="line">software developer</text></g>
  <g class="fade d2"><text x="62" y="210" class="dim">focus    </text><text x="160" y="210" class="line">web · automation · tools that stay out of your way</text></g>
  <g class="fade d3"><text x="62" y="232" class="dim">status   </text><text x="160" y="232" class="line">building<tspan class="acc"> ●</tspan></text></g>
  <rect class="cursor" x="290" y="219" width="10" height="18"/>
</svg>
